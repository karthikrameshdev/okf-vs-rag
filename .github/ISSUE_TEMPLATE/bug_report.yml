name: 🐛 Bug Report
description: Report a bug, retrieval drift, or unexpected benchmark behavior in okf-vs-rag
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide detailed information to help us reproduce and resolve it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When running the OKF vs RAG comparison benchmark, ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Start Qdrant via `docker compose up -d`
        2. Execute `./run.sh`
        3. Trigger comparison query via web dashboard or CLI
        4. Observe unexpected output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Version Details
      description: Please share your operating system and environment versions.
      placeholder: |
        - OS: macOS Sonoma 14.x / Ubuntu 22.04 / Linux
        - Python version: 3.11+
        - Docker version: 27.x
        - Qdrant version: v1.11+
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Traceback
      description: Please paste any relevant console output or stack traces.
      render: shell
