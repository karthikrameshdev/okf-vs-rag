version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: okf_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./storage/qdrant_data:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
